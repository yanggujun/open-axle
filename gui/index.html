<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axle GUI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Axle Agent GUI</h1>
      <span class="server-status" id="server-status">Connecting...</span>
    </header>

    <div class="controls">
      <button id="btn-skills">Get Skills</button>
      <button id="btn-reload">Reload</button>
      <button id="btn-clear">Clear</button>
      <div class="cd-control">
        <input type="text" id="cd-path" placeholder="Enter path...">
        <button id="btn-cd">Change Dir</button>
      </div>
    </div>

    <div id="chat-log" class="chat-log"></div>

    <div class="input-area">
      <textarea id="message-input" placeholder="Type a message..." rows="3"></textarea>
      <button id="btn-send">Send</button>
    </div>
  </div>

  <script src="dist/renderer.js"></script>
</body>
</html>
