<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Open-axle Title Image</title>
  <desc id="desc">Dunhuang Ornament</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#6f4750"/>
      <stop offset="0.62" stop-color="#3b202c"/>
      <stop offset="1" stop-color="#190e18"/>
    </radialGradient>
    <radialGradient id="center" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#73555a"/>
      <stop offset="1" stop-color="#3f3035"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c9b0"/>
      <stop offset="1" stop-color="#d8967d"/>
    </linearGradient>
    <linearGradient id="purplePetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d2878"/>
      <stop offset="1" stop-color="#32133f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#160811" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="centerPetal" d="M400 195 C432 199 457 229 455 267 C452 310 426 340 400 357 C374 340 348 310 345 267 C343 229 368 199 400 195Z"/>
    <g id="flower">
      <g fill="url(#purplePetal)" stroke="#e3aa9c" stroke-width="5" stroke-linejoin="round">
        <path d="M0-60 C20-58 31-38 24-19 C17-2 7 7 0 15 C-7 7-17-2-24-19 C-31-38-20-58 0-60Z"/>
        <path d="M0-60 C20-58 31-38 24-19 C17-2 7 7 0 15 C-7 7-17-2-24-19 C-31-38-20-58 0-60Z" transform="rotate(60)"/>
        <path d="M0-60 C20-58 31-38 24-19 C17-2 7 7 0 15 C-7 7-17-2-24-19 C-31-38-20-58 0-60Z" transform="rotate(120)"/>
        <path d="M0-60 C20-58 31-38 24-19 C17-2 7 7 0 15 C-7 7-17-2-24-19 C-31-38-20-58 0-60Z" transform="rotate(180)"/>
        <path d="M0-60 C20-58 31-38 24-19 C17-2 7 7 0 15 C-7 7-17-2-24-19 C-31-38-20-58 0-60Z" transform="rotate(240)"/>
        <path d="M0-60 C20-58 31-38 24-19 C17-2 7 7 0 15 C-7 7-17-2-24-19 C-31-38-20-58 0-60Z" transform="rotate(300)"/>
      </g>
      <circle r="25" fill="#28141e" stroke="#f0c3a7" stroke-width="5"/>
      <path d="M-14 2 C-11-19 11-19 14 2 C8-4 4 6 0 13 C-4 6-8-4-14 2Z" fill="none" stroke="#f4d2b9" stroke-width="4" stroke-linecap="round"/>
      <circle r="7" fill="#d59a6f"/>
    </g>
    <g id="ornament" fill="none" stroke="#efbda8" stroke-width="6" stroke-linecap="round">
      <path d="M0 0 C20-27 54-22 53 5 C52 25 29 32 15 18 C5 8 14-7 27-3"/>
      <path d="M17 22 C48 29 54 57 35 71"/>
      <path d="M9 15 C-6 30-5 47 8 57"/>
    </g>
  </defs>

  <rect width="800" height="800" rx="176" fill="#f7eee7"/>
  <circle cx="400" cy="400" r="354" fill="url(#background)" filter="url(#shadow)"/>
  <circle cx="400" cy="400" r="346" fill="none" stroke="#7d2b2d" stroke-width="10"/>
  <circle cx="400" cy="400" r="331" fill="none" stroke="#e6b8a1" stroke-width="8"/>
  <circle cx="400" cy="400" r="317" fill="none" stroke="#281424" stroke-width="16"/>
  <circle cx="400" cy="400" r="302" fill="none" stroke="#6c2877" stroke-width="8"/>
  <circle cx="400" cy="400" r="286" fill="#54343d" stroke="#d89d8c" stroke-width="7"/>

  <g opacity="0.95">
    <g transform="translate(400 400) rotate(0) translate(0 -232)"><use href="#flower" transform="scale(.72)"/></g>
    <g transform="translate(400 400) rotate(45) translate(0 -232)"><use href="#flower" transform="scale(.72)"/></g>
    <g transform="translate(400 400) rotate(90) translate(0 -232)"><use href="#flower" transform="scale(.72)"/></g>
    <g transform="translate(400 400) rotate(135) translate(0 -232)"><use href="#flower" transform="scale(.72)"/></g>
    <g transform="translate(400 400) rotate(180) translate(0 -232)"><use href="#flower" transform="scale(.72)"/></g>
    <g transform="translate(400 400) rotate(225) translate(0 -232)"><use href="#flower" transform="scale(.72)"/></g>
    <g transform="translate(400 400) rotate(270) translate(0 -232)"><use href="#flower" transform="scale(.72)"/></g>
    <g transform="translate(400 400) rotate(315) translate(0 -232)"><use href="#flower" transform="scale(.72)"/></g>
  </g>

  <g opacity="0.9">
    <g transform="translate(400 400) rotate(22.5) translate(0 -245) rotate(-50)"><use href="#ornament" transform="scale(.7)"/></g>
    <g transform="translate(400 400) rotate(67.5) translate(0 -245) rotate(-50)"><use href="#ornament" transform="scale(.7)"/></g>
    <g transform="translate(400 400) rotate(112.5) translate(0 -245) rotate(-50)"><use href="#ornament" transform="scale(.7)"/></g>
    <g transform="translate(400 400) rotate(157.5) translate(0 -245) rotate(-50)"><use href="#ornament" transform="scale(.7)"/></g>
    <g transform="translate(400 400) rotate(202.5) translate(0 -245) rotate(-50)"><use href="#ornament" transform="scale(.7)"/></g>
    <g transform="translate(400 400) rotate(247.5) translate(0 -245) rotate(-50)"><use href="#ornament" transform="scale(.7)"/></g>
    <g transform="translate(400 400) rotate(292.5) translate(0 -245) rotate(-50)"><use href="#ornament" transform="scale(.7)"/></g>
    <g transform="translate(400 400) rotate(337.5) translate(0 -245) rotate(-50)"><use href="#ornament" transform="scale(.7)"/></g>
  </g>

  <circle cx="400" cy="400" r="174" fill="#3d292f" stroke="#dfa58f" stroke-width="11"/>
  <circle cx="400" cy="400" r="153" fill="#7a4a48" stroke="#24151d" stroke-width="7"/>

  <g fill="url(#petal)" stroke="#6f292b" stroke-width="6" stroke-linejoin="round">
    <use href="#centerPetal"/>
    <use href="#centerPetal" transform="rotate(45 400 400)"/>
    <use href="#centerPetal" transform="rotate(90 400 400)"/>
    <use href="#centerPetal" transform="rotate(135 400 400)"/>
    <use href="#centerPetal" transform="rotate(180 400 400)"/>
    <use href="#centerPetal" transform="rotate(225 400 400)"/>
    <use href="#centerPetal" transform="rotate(270 400 400)"/>
    <use href="#centerPetal" transform="rotate(315 400 400)"/>
  </g>

  <circle cx="400" cy="400" r="89" fill="url(#center)" stroke="#5b3b40" stroke-width="9"/>
  <circle cx="378" cy="374" r="30" fill="#ffffff" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="400" cy="400" r="365" fill="none" stroke="#4b2022" stroke-width="5"/>
</svg>
